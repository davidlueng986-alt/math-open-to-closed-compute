name: JC2 W2 Exp3 DEGREE-135-IV-GCD-FOUR Lean 14-Eq Probe
on:
  push:
    branches: ['jc2-w2-exp3-gcd4-lean']
    paths:
      - 'jobs/jc2_w2_exp3_gcd4_lean.sing'
      - '.github/workflows/jc2-w2-exp3-gcd4-lean.yml'
  workflow_dispatch:

jobs:
  singular-gcd4-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular
          Singular --version
      - name: Run lean 14-eq Singular probe for DEGREE-135-IV-GCD-FOUR
        run: Singular -q jobs/jc2_w2_exp3_gcd4_lean.sing
