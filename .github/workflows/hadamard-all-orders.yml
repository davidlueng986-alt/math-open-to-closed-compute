name: Verify all-order Hadamard reductions
on:
  workflow_dispatch:
  push:
    paths:
      - 'jobs/hadamard-all-orders/**'
      - '.github/workflows/hadamard-all-orders.yml'
      - 'jobs/hadamard-2396-projections/Triples.lean'
      - 'jobs/hadamard-2396-399/install_lean.sh'
permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check the exact matrices, defect repair and T-sequence congruences
        run: |
          python3 -B jobs/hadamard-all-orders/verify.py
          python3 -B jobs/hadamard-all-orders/stack_1197.py
          python3 -B jobs/hadamard-all-orders/stack_1197_four_channels.py
          python3 -B jobs/hadamard-all-orders/stack_1197_four_channel_gap.py
          python3 -B jobs/hadamard-all-orders/stack_1198_four_channels.py
          python3 -B jobs/hadamard-all-orders/stack_1198_four_channel_compressed.py
          python3 -B jobs/hadamard-all-orders/stack_1198_four_channel_mod32.py
          python3 -B jobs/hadamard-all-orders/stack_1198_four_channel_energy_bound.py
          python3 -B jobs/hadamard-all-orders/stack_1198_four_channel_odd_one.py
          python3 -B jobs/hadamard-all-orders/stack_1198_four_channel_odd_raw.py
          python3 -B jobs/hadamard-all-orders/stack_upper_code.py
          python3 -B jobs/hadamard-all-orders/stack_1198_dense_boundary.py
          python3 -B jobs/hadamard-all-orders/stack_1198_joint.py
          python3 -B jobs/hadamard-all-orders/stack_1198_transport.py
          python3 -B jobs/hadamard-all-orders/stack_1198_auxiliary.py
          python3 -B jobs/hadamard-all-orders/stack_1198_energy.py
          python3 -B jobs/hadamard-all-orders/stack_1198_channels.py
          python3 -B jobs/hadamard-all-orders/stack_1198_reciprocal.py
          python3 -B jobs/hadamard-all-orders/stack_1198_reciprocal_mod5.py
          python3 -B jobs/hadamard-all-orders/stack_1198_marginals.py
          python3 -B jobs/hadamard-all-orders/stack_1198_mod5.py
          python3 -B jobs/hadamard-all-orders/stack_odd_t_auxiliary.py
          python3 -B jobs/hadamard-all-orders/stack_odd_t_code_components.py
          python3 -B jobs/hadamard-all-orders/stack_odd_t_residual.py
          python3 -B jobs/hadamard-all-orders/stack_odd_t_walsh.py
          python3 -B jobs/hadamard-all-orders/stack_odd_t_pair_rigidity.py
          python3 -B jobs/hadamard-all-orders/triple_product.py
          python3 -B jobs/hadamard-all-orders/paley_progression.py
          python3 -B jobs/hadamard-all-orders/golay_progression.py
          python3 -B jobs/hadamard-all-orders/t_product_parity.py
          python3 -B jobs/hadamard-all-orders/conference_plus_two.py
          python3 -B jobs/hadamard-all-orders/t599.py
          python3 -B jobs/hadamard-all-orders/t599_length_change.py
          python3 -B jobs/hadamard-all-orders/t599_golay2_central.py
          python3 -B jobs/hadamard-all-orders/border4_2396.py
          python3 -B jobs/hadamard-all-orders/border4_2396_lift.py
          python3 -B jobs/hadamard-all-orders/border4_2396_both.py
          python3 -B jobs/hadamard-all-orders/border4_2396_paley_split.py
          python3 -B jobs/hadamard-all-orders/border4_2396_exact_negative.py
          python3 -B jobs/hadamard-all-orders/border4_2396_nested.py
          python3 -B jobs/hadamard-all-orders/border4_2396_transfer.py
          python3 -B jobs/hadamard-all-orders/border4_2396_fixed_first.py
          python3 -B jobs/hadamard-all-orders/border4_2396_two_fibers.py
          python3 -B jobs/hadamard-all-orders/border4_2396_primitive_lifts.py
          python3 -B jobs/hadamard-all-orders/border4_2396_shifted_tail.py
          python3 -B jobs/hadamard-all-orders/border4_2396_493.py
          python3 -B jobs/hadamard-all-orders/border4_2396_changed_margins.py
          python3 -B jobs/hadamard-all-orders/border4_2396_tensor_weighing.py
          python3 -B jobs/hadamard-all-orders/r_intersections.py
          python3 -B jobs/hadamard-all-orders/r_large_prime_symmetry.py
          python3 -B jobs/hadamard-all-orders/r_involution_parity.py
          python3 -B jobs/hadamard-all-orders/r_paley_projective_lift.py
          python3 -B jobs/hadamard-all-orders/r_paley_skew_inner.py
          python3 -B jobs/hadamard-all-orders/r_paley_anchored_triples.py
          python3 -B jobs/hadamard-all-orders/r_paley_inner_binary.py
          python3 -B jobs/hadamard-all-orders/r_paley_inner_spectrum.py
          python3 -B jobs/hadamard-all-orders/r_paley_multiflip_inner.py
          python3 -B jobs/hadamard-all-orders/r_paley_nonzero_lower.py
          python3 -B jobs/hadamard-all-orders/r_paley_periodic_skew.py
          python3 -B jobs/hadamard-all-orders/r_paley_bucket_extension.py
          python3 -B jobs/hadamard-all-orders/r_near_complement.py
          python3 -B jobs/hadamard-all-orders/r_two_point.py
          python3 -B jobs/hadamard-all-orders/r_embedding.py
          python3 -B jobs/hadamard-all-orders/five_column_constraints.py
          python3 -B jobs/hadamard-all-orders/five_column_radius.py
          python3 -B jobs/hadamard-all-orders/five_column_gram.py
          python3 -B jobs/hadamard-all-orders/exterior_lift.py
          python3 -B jobs/hadamard-all-orders/exterior_lower_fiber.py
          python3 -B jobs/hadamard-all-orders/exterior_mod16_invariant.py
          python3 -B jobs/hadamard-all-orders/five_column_contrasts.py
          python3 -B jobs/hadamard-all-orders/exterior_mod8.py
          python3 -B jobs/hadamard-all-orders/defect12_mod8.py
          python3 -B jobs/hadamard-all-orders/defect12_exact.py
          python3 -B jobs/hadamard-all-orders/defect12_mod16.py
          python3 -B jobs/hadamard-all-orders/defect12_mod16_family.py
          python3 -B jobs/hadamard-all-orders/defect12_mod32.py
          python3 -B jobs/hadamard-all-orders/defect12_mod32_construction.py
          python3 -B jobs/hadamard-all-orders/defect12_t599_near64.py
          python3 -B jobs/hadamard-all-orders/defect12_near64_family.py
          python3 -B jobs/hadamard-all-orders/defect12_t599_relative.py
          python3 -B jobs/hadamard-all-orders/defect12_t599_comparators.py
          python3 -B jobs/hadamard-all-orders/defect12_t599_sparse.py
          c++ -O3 -std=c++20 -Wall -Wextra -Werror jobs/hadamard-all-orders/paley_omissions.cpp -o "$RUNNER_TEMP/paley_omissions"
          "$RUNNER_TEMP/paley_omissions"
      - name: Replay the four-border fiber exclusions
        run: python3 -B jobs/hadamard-all-orders/border4_2396_full_y_expanded.py
      - name: Install pinned Lean 4.36.0
        run: bash jobs/hadamard-2396-399/install_lean.sh
      - name: Check the next-column neighborhood and the lower-channel candidate
        run: |
          python3 -B jobs/hadamard-all-orders/stack_1198.py --export "$RUNNER_TEMP/stack-1198.bin"
          python3 -B jobs/hadamard-all-orders/stack_1198_two_adic.py
          c++ -O3 -std=c++17 -mpopcnt -Wall -Wextra -Werror jobs/hadamard-all-orders/stack_1198_radii.cpp -o "$RUNNER_TEMP/stack-1198-radii"
          "$RUNNER_TEMP/stack-1198-radii" "$RUNNER_TEMP/stack-1198.bin"
      - name: Check the universal reductions and their axioms
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$RUNNER_TEMP/hadamard-all-orders"
          mkdir -p "$LEAN_PATH"
          lean -DwarningAsError=true -o "$LEAN_PATH/Triples.olean" jobs/hadamard-2396-projections/Triples.lean
          for module in Assembly Reductions Constructions OuterEnergy Rounding Parity BlockedPrefix TripleProduct PaleyProgression GolayProgression PrimeTMatrix TerminalBounds ExteriorBounds; do
            lean -DwarningAsError=true -o "$LEAN_PATH/$module.olean" "jobs/hadamard-all-orders/$module.lean" | tee "$RUNNER_TEMP/$module.log"
            if grep -q 'sorryAx' "$RUNNER_TEMP/$module.log"; then exit 1; fi
          done

  near64-repair-extent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust the fixed comparator's 36-sign repair radius
        run: python3 -B jobs/hadamard-all-orders/defect12_t599_repairs.py --extended

  exact-exterior-factors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate the eight exact omitted projection factors
        run: |
          c++ -O3 -std=c++20 -Wall -Wextra -Werror jobs/hadamard-all-orders/exterior_exact_factors.cpp -o "$RUNNER_TEMP/exterior_exact_factors"
          python3 -B jobs/hadamard-all-orders/exterior_exact_factors.py "$RUNNER_TEMP/exterior_exact_factors"
      - name: Check the folded exterior certificate and its scope
        run: python3 -B jobs/hadamard-all-orders/exterior_folded_obstruction.py
      - name: Check wider folded row changes and matching counts
        run: python3 -B jobs/hadamard-all-orders/exterior_wide_fold.py
      - name: Check fold capacities, factor distances and row-mask rigidity
        run: python3 -B jobs/hadamard-all-orders/exterior_fold_factor_capacity.py
      - name: Check the indexed modulo-eight nonzero physical fold trade
        run: python3 -B jobs/hadamard-all-orders/exterior_fold_trade.py
      - name: Check the exact Hall obstruction at the fixed physical fold
        run: python3 -B jobs/hadamard-all-orders/exterior_fold_hall.py
      - name: Check prescribed fold-coordinate changes and the new physical fold
        run: python3 -B jobs/hadamard-all-orders/exterior_fold_coordinates.py
      - name: Check exact Sylvester anchor pairs and their reindexed modulo-eight matching
        run: python3 -B jobs/hadamard-all-orders/exterior_reindexed_anchors.py
      - name: Check the index-18 fold capacity and exact reindexed witness
        run: python3 -B jobs/hadamard-all-orders/exterior_reindexed_pivot.py
      - name: Check the second-fold orientation census and released anchor witnesses
        run: python3 -B jobs/hadamard-all-orders/exterior_orientation.py
      - name: Check the exact matching retained under physical scalar modulo thirty-two
        run: python3 -B jobs/hadamard-all-orders/exterior_scalar32.py
      - name: Check required fold rank and support for joint modulo sixteen
        run: python3 -B jobs/hadamard-all-orders/exterior_scalar32_fold_rank.py
      - name: Check mixed conditional margins and the joint obstruction
        run: python3 -B jobs/hadamard-all-orders/exterior_scalar32_conditional.py
      - name: Check exact Gram obstructions for five Paley folds
        run: python3 -B jobs/hadamard-all-orders/exterior_scalar32_fold_capacity.py

  stack-replacement-neighborhood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exclude three support replacements for the fixed pivots
        run: |
          c++ -O3 -std=c++20 -Wall -Wextra -Werror -fopenmp jobs/hadamard-all-orders/stack_1198_replacements.cpp -o "$RUNNER_TEMP/stack_1198_replacements"
          OMP_NUM_THREADS=4 python3 -B jobs/hadamard-all-orders/stack_1198_replacements.py "$RUNNER_TEMP/stack_1198_replacements"
          OMP_NUM_THREADS=4 python3 -B jobs/hadamard-all-orders/stack_1198_four_channel_moves.py "$RUNNER_TEMP/stack_1198_replacements"
      - name: Exclude three balanced swaps of the two leading width-four words
        run: python3 -B jobs/hadamard-all-orders/border4_2396_small_first.py

  structured-second-fold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check periodic second-fold families and shortened code cosets
        run: |
          c++ -O3 -march=native -std=c++20 -Wall -Wextra -Werror jobs/hadamard-all-orders/exterior_second_fold.cpp -o "$RUNNER_TEMP/exterior_second_fold"
          python3 -B jobs/hadamard-all-orders/exterior_second_fold.py "$RUNNER_TEMP/exterior_second_fold"

  exact-source-columns:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned CaDiCaL solver and DRAT checker
        shell: bash
        run: |
          cadical="$RUNNER_TEMP/cadical"
          mkdir "$cadical"
          curl -fsSL --retry 3 https://codeload.github.com/arminbiere/cadical/tar.gz/146207318796f094dcded87349a64f0c6927309e | tar xz --strip-components=1 -C "$cadical"
          (cd "$cadical" && ./configure --quiet && make -j2)
          checker="$RUNNER_TEMP/drat-trim.c"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/marijnheule/drat-trim/2e3b2dc0ecf938addbd779d42877b6ed69d9a985/drat-trim.c -o "$checker"
          echo "d834b649f437e091597f5347f259b9f681087f89ca0844d0cee250a1a1a0c2ee  $checker" | sha256sum --check
          cc -O2 "$checker" -o "$RUNNER_TEMP/drat-trim"
      - name: Verify that no cyclic block can keep 15 original columns
        shell: bash
        run: |
          input="$RUNNER_TEMP/near64-exact.cnf"
          proof="$RUNNER_TEMP/near64-exact.drat"
          python3 -B jobs/hadamard-all-orders/defect12_t599_exact_cnf.py "$input"
          unsat=0
          "$RUNNER_TEMP/cadical/build/cadical" "$input" "$proof" || unsat=$?
          test "$unsat" -eq 20
          "$RUNNER_TEMP/drat-trim" "$input" "$proof" | tr '\r' '\n' | tee "$RUNNER_TEMP/near64-exact-check.log"
          grep -qx 's VERIFIED' "$RUNNER_TEMP/near64-exact-check.log"
