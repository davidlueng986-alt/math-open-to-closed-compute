name: Verify all-order Hadamard reductions
on:
  workflow_dispatch:
  push:
    paths:
      - 'jobs/hadamard-all-orders/**'
      - '.github/workflows/hadamard-all-orders.yml'
      - 'jobs/hadamard-2396-projections/Triples.lean'
      - 'jobs/hadamard-2396-399/install_lean.sh'
permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check closure dependencies and task readiness
        run: python3 jobs/hadamard-all-orders/closure-dag/check_dag.py --check-tasks
      - name: Check that the graph and task views match their source
        run: python3 -B jobs/hadamard-all-orders/closure-dag/render.py --check
      - name: Replay the pivot-to-clique correspondence
        run: python3 -B jobs/hadamard-all-orders/closure-dag/verify_pivot.py
      - name: Verify the archived H44 signatures and all modular collisions
        run: python3 -B jobs/hadamard-all-orders/first-match/verify_first_match.py
      - name: Replay the H28 obstruction and construct H92 from 45 block pairs
        run: python3 -B jobs/hadamard-all-orders/first-match/verify_designs.py
      - name: Replay codimension-eight extension and exclusion controls
        run: python3 -B jobs/hadamard-all-orders/closure-dag/verify_endgame.py
      - name: Reconstruct the incidence examples and the 2396 by 1196 matrix
        run: python3 jobs/hadamard-all-orders/verify.py
      - name: Install pinned Lean 4.36.0
        run: bash jobs/hadamard-2396-399/install_lean.sh
      - name: Check the universal reductions and their axioms
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$RUNNER_TEMP/hadamard-all-orders"
          mkdir -p "$LEAN_PATH"
          lean -DwarningAsError=true -o "$LEAN_PATH/Triples.olean" jobs/hadamard-2396-projections/Triples.lean
          proof_dir=jobs/hadamard-all-orders
          for source in "$proof_dir"/{Assembly,Reductions,Constructions,OuterEnergy,Rounding}.lean \
            "$proof_dir"/first-match/{Lattice,PairDefect,SwitchParity,Coverage45,Star1195}.lean; do
            module=${source##*/}
            module=${module%.lean}
            lean -DwarningAsError=true -o "$LEAN_PATH/$module.olean" "$source" | tee "$RUNNER_TEMP/$module.log"
            if grep -q 'sorryAx' "$RUNNER_TEMP/$module.log"; then exit 1; fi
          done
