name: MOLS10 joint relaxed LNS — one-shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jobs/mols10-relaxed-lns/launch.txt'
permissions:
  contents: read
concurrency:
  group: mols10-relaxed-lns
  cancel-in-progress: false
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash jobs/mols10-relaxed-lns/setup.sh
      - run: |
          mkdir -p out
          bash jobs/mols10-relaxed-lns/run.sh "${{ matrix.shard }}" 8 out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
  collect:
    needs: [shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      JOB: mols10-relaxed-lns
      SHARDS: '8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash jobs/mols10-relaxed-lns/setup.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - run: python3 scripts/collect.py
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary/
          retention-days: 30
      - run: bash scripts/commit_results.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 scripts/collect.py --check
