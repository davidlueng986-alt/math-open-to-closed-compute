name: E64 Wave 7 Agent 8 Girth-5+ & Adjuster Closure (Lean 4.36.0)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Wave7Agent8Girth5Closure and transitive axioms
        run: bash jobs/erdos64-wave7-agent8-girth5-closure/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave7-agent8-girth5-closure
          path: out/
          retention-days: 90
