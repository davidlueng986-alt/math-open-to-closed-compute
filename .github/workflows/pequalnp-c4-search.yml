name: P vs NP C4-free circuit counterexample search

on:
  push:
    branches: [pnp-l-meta-3241]
    paths:
      - jobs/pequalnp-c4-search/search.py
      - .github/workflows/pequalnp-c4-search.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - points: 3
            lines: 5
          - points: 4
            lines: 4
          - points: 4
            lines: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-sat==1.9.dev25
      - name: Synthesize monotone circuits
        env:
          POINTS: ${{ matrix.points }}
          LINES: ${{ matrix.lines }}
        run: |
          python jobs/pequalnp-c4-search/search.py "$POINTS" "$LINES" \
            --workers 4 --conflicts 1500000 --output result.json
      - uses: actions/upload-artifact@v4
        with:
          name: c4-circuits-${{ matrix.points }}x${{ matrix.lines }}
          path: result.json
          if-no-files-found: error
          retention-days: 14
