name: Erdos 25 wave 6 fiber Fourier verification
on:
  push:
    paths:
      - 'jobs/erdos25-wave6-fiber-fourier/**'
      - '.github/workflows/erdos25-wave6-fiber-fourier.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  abel-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bash jobs/erdos25-wave6-fiber-fourier/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos25-fiber-fourier-lean
          path: out/
  monotone-cube:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python jobs/erdos25-wave6-fiber-fourier/check_cubes.py
