name: JC2 W2 Exp3 SECANT-HEIGHT-FOUR d=5 (j=4) Exact Q(kap) Proof
on:
  push:
    branches: ['jc2-w2-exp3-secant-d5']
    paths:
      - 'jobs/jc2_w2_exp3_secant_d5.sing'
      - '.github/workflows/jc2-w2-exp3-secant-d5.yml'
  workflow_dispatch:

jobs:
  singular-secant-d5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular
          Singular --version
      - name: Run pure-Singular exact Q(kap) proof for d=5 (j=4)
        run: Singular -q jobs/jc2_w2_exp3_secant_d5.sing
