name: E64 Wave 8 Agent 6 Girth 9-14 OpenMP Siege (C++20)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  siege:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run OpenMP C++20 girth 9-14 siege
        run: |
          mkdir -p out
          g++ -O3 -std=c++20 -fopenmp jobs/erdos64-wave8-agent6-girth9-siege/girth9_14_openmp_siege.cpp -o out/siege
          ./out/siege | tee out/siege_report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave8-agent6-girth9-siege
          path: out/
          retention-days: 90
