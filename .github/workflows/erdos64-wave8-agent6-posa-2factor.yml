name: E64 Wave 8 Agent 6 Posa & C5-Quotient Closure (Lean 4.36.0)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Wave8Agent6Posa2Factor and transitive axioms
        run: bash jobs/erdos64-wave8-agent6-posa-2factor/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave8-agent6-posa-2factor
          path: out/
          retention-days: 90
