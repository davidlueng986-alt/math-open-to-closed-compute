name: E64 Wave 6 Agent 4 Cycle-Contraction Subset-Sum Closure

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Wave6Agent4CycleContraction in Lean 4.36.0
        run: bash jobs/erdos64-wave6-agent4-cpq-subset-sum/verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: erdos64-wave6-agent4-cpq-subset-sum
          path: out/
          retention-days: 90
