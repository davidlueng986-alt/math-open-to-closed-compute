name: E64 Wave 8 Agent 10 Lean 4.36.0 Unconditional Closure Suite

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Erdos64Wave8Agent10 in Lean 4.36.0
        run: bash jobs/erdos64-wave8-agent10-lean/verify.sh
      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: erdos64-wave8-agent10-lean
          path: out/
          retention-days: 90
