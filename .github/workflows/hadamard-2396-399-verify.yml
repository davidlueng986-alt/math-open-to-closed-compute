name: Verify Hadamard 2396 lifts and symmetry bounds
on:
  workflow_dispatch:
    inputs:
      records_only:
        description: Check the new full-correlation records and exact local neighborhood
        type: boolean
        default: false
      orbit_only:
        description: Replay only the original orbit-exchange census
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  certificates:
    if: ${{ !inputs.records_only && !inputs.orbit_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recompute original and compressed correlations and rational ranks
        run: |
          python3 jobs/hadamard-2396-399/certificate.py
          python3 jobs/hadamard-2396-squares/verify.py
      - name: Install the verified Lean 4.36.0 release
        run: bash jobs/hadamard-2396-399/install_lean.sh
      - name: Kernel-check all 200 listed original shifts and the shear obstruction
        run: |
          set -euo pipefail
          export LEAN_PATH="$RUNNER_TEMP/hadamard-olean"
          mkdir -p "$LEAN_PATH"
          for path in hadamard-2396-projections/Triples hadamard-2396-projections/Witness hadamard-2396-diagonal/Diagonal hadamard-2396-399/Quotient399 hadamard-2396-399/Obstructions; do
            name=${path##*/}
            (cd "jobs/${path%/*}" && lean -j1 -M5500 -DwarningAsError=true -o "$LEAN_PATH/$name.olean" "$name.lean") | tee "$RUNNER_TEMP/$name.log"
            if grep -q 'sorryAx' "$RUNNER_TEMP/$name.log"; then exit 1; fi
          done
  templates:
    if: ${{ !inputs.records_only && !inputs.orbit_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jobs/hadamard-2396-399/symmetry
    steps:
      - uses: actions/checkout@v4
      - name: Independently check the affine orbit counts and the sparse autocorrelations
        run: |
          set -euo pipefail
          for f in templates quotients vertical; do
            g++ -O3 -std=c++17 -mpopcnt -Wall -Wextra -Werror "$f.cpp" -o "$RUNNER_TEMP/$f"
          done
          "$RUNNER_TEMP/templates" > "$RUNNER_TEMP/templates.txt" 2> "$RUNNER_TEMP/templates.log"
          cmp "$RUNNER_TEMP/templates.txt" ../../hadamard-2396-squares/templates.txt
          python3 check_templates.py "$RUNNER_TEMP/templates.txt" "$RUNNER_TEMP/templates.log"
      - name: Replay exact quotient feasibility tests
        run: |
          set -euo pipefail
          python3 sieve.py "$RUNNER_TEMP/templates.txt" "$RUNNER_TEMP/quotients" 3 7 9 --vertical "$RUNNER_TEMP/vertical" --write-orientations "$RUNNER_TEMP/orientations.hex" | tee "$RUNNER_TEMP/sieve.log"
          cmp "$RUNNER_TEMP/orientations.hex" ../../hadamard-2396-squares/orientations.hex
          diff -u expected.txt "$RUNNER_TEMP/sieve.log"
      - name: Reproduce templates and quotient cuts on the elementary-3 group
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/templates" plane > "$RUNNER_TEMP/plane.txt" 2> "$RUNNER_TEMP/plane.log"
          python3 check_templates.py "$RUNNER_TEMP/plane.txt" "$RUNNER_TEMP/plane.log" --plane
          python3 plane_sieve.py "$RUNNER_TEMP/plane.txt" "$RUNNER_TEMP/quotients" | tee "$RUNNER_TEMP/plane-sieve.log"
          diff -u plane-expected.txt "$RUNNER_TEMP/plane-sieve.log"

  original-records:
    if: ${{ !inputs.orbit_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recheck the complete word masks and all 598 correlations
        run: |
          python3 jobs/hadamard-2396-coverage/check_records.py
          python3 jobs/hadamard-2396-coverage/remaining.py
      - name: Verify the exact singleton neighborhood and planted control
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 -mpopcnt -Wall -Wextra -Werror jobs/hadamard-2396-squares/repair.cpp -o "$RUNNER_TEMP/repair"
          python3 jobs/hadamard-2396-squares/neighborhood.py "$RUNNER_TEMP/repair"
      - name: Install the verified Lean 4.36.0 release
        run: bash jobs/hadamard-2396-399/install_lean.sh
      - name: Kernel-check all cyclic scores and shift counts
        run: |
          set -euo pipefail
          export LEAN_PATH="$RUNNER_TEMP/hadamard-records"
          mkdir -p "$LEAN_PATH"
          for path in hadamard-2396-projections/Triples hadamard-2396-coverage/SquareAction hadamard-2396-coverage/Coverage; do
            name=${path##*/}
            (cd "jobs/${path%/*}" && lean -j1 -M5500 -DwarningAsError=true -o "$LEAN_PATH/$name.olean" "$name.lean") | tee "$RUNNER_TEMP/$name.log"
            if grep -q 'sorryAx' "$RUNNER_TEMP/$name.log"; then exit 1; fi
          done

  orbit-neighborhood:
    if: ${{ !inputs.records_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the seven-variable determinant and both original exchange neighborhoods
        run: |
          set -euo pipefail
          python3 jobs/hadamard-2396-coverage/remaining.py
          g++ -O3 -std=c++17 -mpopcnt -Wall -Wextra -Werror jobs/hadamard-2396-coverage/two_exchanges.cpp -o "$RUNNER_TEMP/two-exchanges"
          python3 jobs/hadamard-2396-coverage/repair49.py "$RUNNER_TEMP/two-exchanges"
