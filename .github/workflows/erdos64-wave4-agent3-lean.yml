name: E64 Wave4 Agent3 Global Closure Lean
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify Wave4Agent3GlobalClosure and axioms
        run: bash jobs/erdos64-wave4-agent3-lean/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-w4a3-lean
          path: out/
          retention-days: 90
