name: Verify Hadamard 2396 certificates
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/hadamard-2396-projections
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute sign words, quotient equations and search neighborhoods
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5
          python verify.py
          python construct.py
          python check_shapes.py
          python check_neighborhood.py
      - name: Reproduce the order-63 and order-19 witness
        working-directory: jobs/hadamard-2396-diagonal
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -mpopcnt -Wall -Wextra -Werror search.cpp -o "$RUNNER_TEMP/diagonal"
          python check.py --signs seed | "$RUNNER_TEMP/diagonal" both 1210 200000 300000 > "$RUNNER_TEMP/replay.json"
          python check.py --replay "$RUNNER_TEMP/replay.json"
          python groups.py
      - name: Install pinned Lean 4.36.0
        run: |
          set -euo pipefail
          pkg=lean-4.36.0-linux.tar.zst
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 -o "$pkg" "https://github.com/leanprover/lean4/releases/download/v4.36.0/$pkg"
          echo "2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb  $pkg" | sha256sum --check
          tar --zstd -xf "$pkg" --wildcards 'lean-4.36.0-linux/bin/*' 'lean-4.36.0-linux/lib/*'
          echo "$RUNNER_TEMP/lean-4.36.0-linux/bin" >> "$GITHUB_PATH"
      - name: Kernel-check the multiplier theorem and the mixed-subgroup witness
        run: |
          set -euo pipefail
          export LEAN_PATH="$RUNNER_TEMP/hadamard-olean"
          mkdir -p "$LEAN_PATH"
          lean --version
          for f in Triples PrimeCycles Witness RawShifts; do
            lean -j1 -M5500 -DwarningAsError=true -o "$LEAN_PATH/$f.olean" "$f.lean" | tee "$RUNNER_TEMP/$f.log"
            if grep -q 'sorryAx' "$RUNNER_TEMP/$f.log"; then exit 1; fi
          done
          lean -j1 -M5500 -DwarningAsError=true ../hadamard-2396-diagonal/Diagonal.lean | tee "$RUNNER_TEMP/Diagonal.log"
          if grep -q 'sorryAx' "$RUNNER_TEMP/Diagonal.log"; then exit 1; fi
