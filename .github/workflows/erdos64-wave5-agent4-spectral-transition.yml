name: E64 Wave 5 Agent 4 Second-Window Spectral & Transition Lift (Lean 4.36.0)
on:
  push:
    branches: [main]
    paths:
      - 'jobs/erdos64-wave5-agent4-spectral-transition/**'
      - '.github/workflows/erdos64-wave5-agent4-spectral-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify Wave5Agent4WholeClosure in Lean 4.36.0
        run: bash jobs/erdos64-wave5-agent4-spectral-transition/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave5-agent4-spectral-transition
          path: out/
          retention-days: 90
