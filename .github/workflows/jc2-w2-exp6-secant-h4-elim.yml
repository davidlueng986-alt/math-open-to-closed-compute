name: JC2 W2 Exp6 SECANT-HEIGHT-FOUR Top-Down Exact Q-Proof (d=2..6)
on:
  push:
    branches: ['jc2-w2-exp6-secant-h4']
    paths:
      - 'jobs/jc2_w2_exp6_secant_h4_elim.sing'
      - '.github/workflows/jc2-w2-exp6-secant-h4-elim.yml'
  workflow_dispatch:

jobs:
  singular-secant-h4-elim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular
          Singular --version
      - name: Run top-down Q(rho)-eliminated exact Q-proof for d=2..6
        run: Singular -q jobs/jc2_w2_exp6_secant_h4_elim.sing
