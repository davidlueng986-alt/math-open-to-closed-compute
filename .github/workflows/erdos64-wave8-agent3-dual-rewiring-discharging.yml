name: E64 Wave 8 Agent 3 Dual Cross-Rewiring, Global Discharging & Tutte Coupling (Lean 4.36.0 + OpenMP)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lean_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Wave 8 Agent 3 Lean 4.36.0 modules and transitive axioms
        run: bash jobs/erdos64-wave8-agent3-dual-rewiring-discharging/verify.sh
      - name: Upload Lean verification artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave8-agent3-lean
          path: out/
          retention-days: 90

  dual_rewiring_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compile and run OpenMP C++20 Dual Cross-Rewiring & Discharging Audit
        run: |
          mkdir -p out
          g++ -O3 -fopenmp -std=c++20 -Wall -Wextra jobs/erdos64-wave8-agent3-dual-rewiring-discharging/dual_rewiring_audit.cpp -o dual_rewiring_audit
          ./dual_rewiring_audit --full out/dual_rewiring_audit.json | tee out/dual_rewiring_audit.log
      - name: Upload C++20 audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave8-agent3-cpp-audit
          path: out/
          retention-days: 90
