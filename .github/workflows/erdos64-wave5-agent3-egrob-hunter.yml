name: E64 Wave5 Agent3 EGRob/EG2 Counterexample Hunter

on:
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: band_26_32
            cases: "26:0:400000:0 28:0:400000:0 30:0:400000:0 32:0:400000:200 27:1:400000:0 29:1:400000:0 31:1:400000:0"
          - id: band_34_40
            cases: "34:0:400000:250 36:0:400000:250 38:0:400000:250 40:0:400000:250 33:1:400000:250 35:1:400000:250 39:1:400000:250"
          - id: band_42_48
            cases: "42:0:450000:300 44:0:450000:300 46:0:450000:300 48:0:450000:300 41:1:450000:300 45:1:450000:300"
          - id: band_50_56
            cases: "50:0:450000:300 52:0:450000:300 54:0:450000:300 56:0:450000:300 49:1:450000:300 53:1:450000:300"
          - id: band_58_64
            cases: "58:0:500000:350 60:0:500000:350 62:0:500000:350 64:0:500000:350 57:1:500000:350 61:1:500000:350"
          - id: band_66_72
            cases: "66:0:500000:350 68:0:500000:350 70:0:500000:350 72:0:500000:350 65:1:500000:350 71:1:500000:350"
          - id: band_74_78
            cases: "74:0:600000:400 76:0:600000:400 78:0:600000:400 77:1:600000:400"
          - id: band_80_84
            cases: "80:0:600000:400 82:0:600000:400 84:0:600000:400 83:1:600000:400"
          - id: band_86_90
            cases: "86:0:600000:400 88:0:600000:400 90:0:600000:400 89:1:600000:400"
          - id: band_d4_2
            cases: "28:2:400000:0 36:2:400000:250 48:2:450000:300 60:2:500000:350 72:2:500000:350 84:2:500000:350"
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run EGRob/EG2 OpenMP hunter
        run: |
          g++ -O3 -fopenmp -std=c++20 -march=native jobs/erdos64-wave5-agent3-egrob-hunter/egrob_hunter.cpp -o egrob_hunter
          mkdir -p out
          for spec in ${{ matrix.cases }}; do
            IFS=':' read -r N D4 STEPS POLISH <<< "$spec"
            echo "=== RUNNING n=$N d4=$D4 steps=$STEPS polish=$POLISH ==="
            ./egrob_hunter "$N" "$D4" 16 "$STEPS" "$POLISH" 4 | tee "out/egrob_n${N}_d4_${D4}.log"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: erdos64-w5a3-egrob-${{ matrix.id }}
          path: out/
          retention-days: 30
