name: E64 Wave 5 Agent 6 Unconditional Chebyshev-Girth Closure
on:
  push:
    branches: [main]
    paths:
      - 'jobs/erdos64-wave5-agent6-chebyshev-girth/**'
      - '.github/workflows/erdos64-wave5-agent6-chebyshev-girth.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify Wave5Agent6ChebyshevGirth in Lean 4.36.0
        run: bash jobs/erdos64-wave5-agent6-chebyshev-girth/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave5-agent6-chebyshev-girth
          path: out/
          retention-days: 90
