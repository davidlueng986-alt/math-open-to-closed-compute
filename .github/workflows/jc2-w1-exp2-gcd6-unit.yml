name: JC2 Exp2 DEGREE-135-IV-GCD-SIX Pure-Singular Q-Proof
on:
  push:
    branches: ['jc2-w1-exp2-gcd6-unit']
    paths:
      - 'jobs/jc2_exp2_gcd6_unit.sing'
      - '.github/workflows/jc2-w1-exp2-gcd6-unit.yml'
  workflow_dispatch:

jobs:
  singular-gcd6-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular
          Singular --version
      - name: Run pure-Singular exact Q-proof for DEGREE-135-IV-GCD-SIX
        run: Singular -q jobs/jc2_exp2_gcd6_unit.sing
