name: JC2 W2 Exp5 Height-Four Parallel Matrix
on:
  push:
    branches: ['jc2-w2-exp5-h4']
    paths:
      - 'jobs/jc2_w2_exp5_h4_lib.sing'
      - '.github/workflows/jc2-w2-exp5-h4-matrix.yml'
  workflow_dispatch:

jobs:
  singular-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: case1_d234_q
            cmd: 'int r; r=run_case1(2,0); r=run_case1(3,0); r=run_case1(4,0);'
          - name: case2_d234_q
            cmd: 'int r; r=run_case2(2,0); r=run_case2(3,0); r=run_case2(4,0);'
          - name: case1_d5_q
            cmd: 'int r; r=run_case1(5,32003); r=run_case1(5,0);'
          - name: case2_d5_fp
            cmd: 'int r; r=run_case2(5,32003);'
          - name: case2_d5_q
            cmd: 'int r; r=run_case2(5,0);'
          - name: case1_d6_fp
            cmd: 'int r; r=run_case1(6,32003);'
          - name: case1_d6_q
            cmd: 'int r; r=run_case1(6,0);'
          - name: case2_d6_fp
            cmd: 'int r; r=run_case2(6,32003);'
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular
          Singular --version
      - name: Run ${{ matrix.name }}
        run: |
          cat > run_job.sing << 'EOF'
          < "jobs/jc2_w2_exp5_h4_lib.sing";
          ${{ matrix.cmd }}
          quit;
          EOF
          Singular -q run_job.sing
