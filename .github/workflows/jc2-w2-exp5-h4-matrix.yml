name: JC2 W2 Exp5 Height-Four Parallel Matrix
on:
  push:
    branches: ['jc2-w2-exp5-h4']
    paths:
      - 'jobs/jc2_w2_exp5_h4_lib.sing'
      - '.github/workflows/jc2-w2-exp5-h4-matrix.yml'
  workflow_dispatch:

jobs:
  singular-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: case1_d2345_q_modstd
            cmd: 'int r; r=run_case1(2,0,0); r=run_case1(3,0,0); r=run_case1(4,0,0); r=run_case1(5,32003,0); r=run_case1(5,0,1);'
          - name: case2_d234_q_modstd
            cmd: 'int r; r=run_case2(2,0,0); r=run_case2(3,0,0); r=run_case2(4,32003,0); r=run_case2(4,0,1);'
          - name: case2_d5_fp
            cmd: 'int r; r=run_case2(5,32003,0);'
          - name: case2_d5_q_modstd
            cmd: 'int r; r=run_case2(5,0,1);'
          - name: case1_d6_q_modstd
            cmd: 'int r; r=run_case1(6,0,1);'
          - name: case1_d7_fp
            cmd: 'int r; r=run_case1(7,32003,0);'
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular
          Singular --version
      - name: Run ${{ matrix.name }}
        run: |
          cat > run_job.sing << 'EOF'
          < "jobs/jc2_w2_exp5_h4_lib.sing";
          ${{ matrix.cmd }}
          quit;
          EOF
          Singular -q run_job.sing
