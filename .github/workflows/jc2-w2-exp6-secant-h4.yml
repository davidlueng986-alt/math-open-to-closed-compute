name: JC2 W2 Exp6 SECANT-HEIGHT-FOUR Coupled ODE Q-Proof
on:
  push:
    branches: ['jc2-w2-exp6-secant-h4']
    paths:
      - 'jobs/jc2_w2_exp6_secant_h4.sing'
      - '.github/workflows/jc2-w2-exp6-secant-h4.yml'
  workflow_dispatch:

jobs:
  singular-secant-h4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular
          Singular --version
      - name: Run coupled SECANT-HEIGHT-FOUR-REALIZATION Singular proof
        run: Singular -q jobs/jc2_w2_exp6_secant_h4.sing
