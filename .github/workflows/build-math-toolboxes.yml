name: Build math toolboxes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - '.github/workflows/build-math-toolboxes.yml'
      - 'jobs/erdos-64-sms-direct/setup.sh'
permissions:
  contents: read
  packages: write
concurrency:
  group: math-toolboxes-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        toolbox: [sat, sage, lean]
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          TOOLBOX: ${{ matrix.toolbox }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$owner/math-compute-$TOOLBOX" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/${{ matrix.toolbox }}/Dockerfile
          load: true
          tags: ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Test image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:latest
          TOOLBOX: ${{ matrix.toolbox }}
        run: bash containers/smoke-test.sh "$TOOLBOX" "$IMAGE"
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker tag "$IMAGE:latest" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
