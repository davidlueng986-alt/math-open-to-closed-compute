name: JC2 W2 Exp5 SECANT-HEIGHT-FOUR-REALIZATION Singular Proof
on:
  push:
    branches: ['jc2-w2-exp5-h4']
    paths:
      - 'jobs/jc2_w2_exp5_h4.sing'
      - '.github/workflows/jc2-w2-exp5-h4.yml'
  workflow_dispatch:

jobs:
  singular-h4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular
          Singular --version
      - name: Run pure-Singular exact Q-proof for SECANT-HEIGHT-FOUR-REALIZATION d=2..6
        run: Singular -q jobs/jc2_w2_exp5_h4.sing
