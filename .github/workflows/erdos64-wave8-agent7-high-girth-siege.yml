name: E64 Wave 8 Agent 7 High-Girth & Triple-Rewiring Siege (Lean 4.36.0 + OpenMP)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lean_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Wave 8 Agent 7 Lean 4.36.0 theorems and transitive axioms
        run: bash jobs/erdos64-wave8-agent7-high-girth-siege/verify.sh
      - name: Upload Lean verification artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave8-agent7-lean
          path: out/
          retention-days: 90

  high_girth_siege:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compile and run OpenMP C++20 High-Girth (g in {9..14}) Siege
        run: |
          mkdir -p out
          g++ -O3 -fopenmp -std=c++20 -Wall -Wextra jobs/erdos64-wave8-agent7-high-girth-siege/high_girth_siege_omp.cpp -o high_girth_siege_omp
          ./high_girth_siege_omp out/high_girth_siege.json | tee out/high_girth_siege.log
      - name: Upload High-Girth Siege artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave8-agent7-high-girth-siege
          path: out/
          retention-days: 90
