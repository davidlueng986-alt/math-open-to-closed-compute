name: E64 exact three-port gadget census and certified substitution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jobs/erdos64-threeport-frontier/**'
      - '.github/workflows/erdos64-threeport-frontier.yml'
permissions:
  contents: read
  packages: read
defaults:
  run:
    shell: bash
jobs:
  small_census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-sat:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust all connected simple 3-port graphs up to order 13
        run: |
          set -euo pipefail
          mkdir -p out
          g++ -O3 -std=c++17 jobs/erdos64-threeport-frontier/gadgets.cpp -o /tmp/gadgets
          for n in 3 5 7 9 11 13; do
            e=$(( (3*n-3)/2 ))
            nauty-geng -cq -d2 -D3 "$n" "$e:$e" | /tmp/gadgets > "out/gadgets-$n.jsonl" 2> "out/count-$n.json"
            echo "$n"; cat "out/count-$n.json"
          done
          cat out/gadgets-*.jsonl > out/gadgets.jsonl
          for n in 4 6 8 10; do
            nauty-geng -cq -d3 -D3 "$n"
          done > out/bases.g6
          wc -l out/gadgets.jsonl out/bases.g6
      - uses: actions/upload-artifact@v4
        with:
          name: small-census
          path: out/
          retention-days: 30
  large_census:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-sat:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Complete order 15 and 17 census partitions
        run: |
          set -euo pipefail
          mkdir -p out
          g++ -O3 -std=c++17 jobs/erdos64-threeport-frontier/gadgets.cpp -o /tmp/gadgets
          for n in 15 17; do
            e=$(( (3*n-3)/2 ))
            nauty-geng -cq -d2 -D3 "$n" "$e:$e" "${{ matrix.shard }}/8" | /tmp/gadgets > "out/gadgets-$n.jsonl" 2> "out/count-$n.json"
            echo "$n"; cat "out/count-$n.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-${{ matrix.shard }}
          path: out/
          retention-days: 30
  small_search:
    needs: small_census
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-sat:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: small-census
          path: data
      - run: python3 jobs/erdos64-threeport-frontier/search.py --gadgets data/gadgets.jsonl --bases data/bases.g6 --shard ${{ matrix.shard }} --shards 4 --seconds 180 --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: small-search-${{ matrix.shard }}
          path: out/
          retention-days: 30
  large_search:
    needs: [small_census, large_census]
    runs-on: ubuntu-latest
    timeout-minutes: 140
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-sat:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: large-*
          path: large
      - uses: actions/download-artifact@v4
        with:
          name: small-census
          path: data
      - run: |
          set -euo pipefail
          cat data/gadgets.jsonl large/*/gadgets-*.jsonl > data/all.jsonl
          python3 jobs/erdos64-threeport-frontier/search.py --gadgets data/all.jsonl --bases data/bases.g6 --shard ${{ matrix.shard }} --shards 8 --seconds 600 --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-search-${{ matrix.shard }}
          path: out/
          retention-days: 30
