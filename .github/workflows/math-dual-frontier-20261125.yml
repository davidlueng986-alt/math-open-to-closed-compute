name: E64 marked expansions and JC2 ring obstruction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jobs/erdos64-marked-expansion/**'
      - 'jobs/jacobian-mixed-section/**'
      - '.github/workflows/math-dual-frontier-20261125.yml'
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: erdos64
            file: jobs/erdos64-marked-expansion/Marked.lean
          - target: jc2
            file: jobs/jacobian-mixed-section/Obstruction.lean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: 0df444a360eaa60ab8c11dca51a86af692955474
          path: mathlib4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat mathlib4/lean-toolchain)"
      - name: Fetch Mathlib cache
        working-directory: mathlib4
        run: lake exe cache get
      - name: Kernel-check and audit axioms
        working-directory: mathlib4
        env:
          PROOF_FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          lake env lean -DwarningAsError=true "$GITHUB_WORKSPACE/$PROOF_FILE" 2>&1 | tee "$GITHUB_WORKSPACE/out/lean.log"
          if grep -E 'sorryAx|native_decide|sorry' "$GITHUB_WORKSPACE/out/lean.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-${{ matrix.target }}
          path: out/
  marked_search:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'networkx==3.4.2' python-sat
      - name: Direct search for actual cubic counterexample
        run: python jobs/erdos64-marked-expansion/search.py --shard ${{ matrix.shard }} --count 24 --seconds 120 --out out/results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marks-${{ matrix.shard }}
          path: out/
  replay_326:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: davidlueng986-alt/erdos-326-lean-proof
          ref: 995cb382fb1c61c89d7ffa29b64021e8bcb274cf
          path: proof326
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat proof326/lean/lean-toolchain)"
      - name: Replay exact published original theorem
        working-directory: proof326/lean
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/out/commit.txt"
          lake exe cache get
          lake build 2>&1 | tee "$GITHUB_WORKSPACE/out/build.log"
          lake env lean -DwarningAsError=true Erdos326.lean 2>&1 | tee "$GITHUB_WORKSPACE/out/axioms.log"
          test "$(grep -c 'depends on axioms' "$GITHUB_WORKSPACE/out/axioms.log")" -eq 3
          if grep -E 'sorryAx|native_decide' "$GITHUB_WORKSPACE/out/axioms.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos326-independent-replay
          path: out/
