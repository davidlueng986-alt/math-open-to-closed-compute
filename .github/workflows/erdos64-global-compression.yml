name: E64 global mixed spectral descent and local replacement rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jobs/erdos64-global-compression/**'
      - '.github/workflows/erdos64-global-compression.yml'
permissions:
  contents: read
  packages: read
defaults:
  run:
    shell: bash
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-sat:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Exact spectra and constructive cycle-lift controls
        run: python3 jobs/erdos64-global-compression/verify.py
  local_rules:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-sat:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        n: [4,6,8,10,12,14]
    steps:
      - uses: actions/checkout@v4
      - name: Synthesize universally applicable port-spectrum replacements
        run: |
          set -euo pipefail
          mkdir -p out
          g++ -O3 -std=c++17 jobs/erdos64-global-compression/replacements.cpp -o /tmp/replace
          n=${{ matrix.n }}
          e=$(( (3*n-4)/2 ))
          nauty-geng -cq -d1 -D3 "$n" "$e:$e" | /tmp/replace > out/rules.jsonl 2> out/count.json
          cat out/count.json
          head -c 5000 out/rules.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-rules-${{ matrix.n }}
          path: out/
          retention-days: 30
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: 0df444a360eaa60ab8c11dca51a86af692955474
          path: mathlib4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat mathlib4/lean-toolchain)"
      - name: Fetch Mathlib
        working-directory: mathlib4
        run: lake exe cache get
      - name: Strict kernel audit of universal lift budget
        working-directory: mathlib4
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          lake env lean -DwarningAsError=true "$GITHUB_WORKSPACE/jobs/erdos64-global-compression/Compression.lean" 2>&1 | tee "$GITHUB_WORKSPACE/out/lean.log"
          test "$(grep -c 'depends on axioms' "$GITHUB_WORKSPACE/out/lean.log")" -eq 7
          ! grep -E 'sorryAx|native_decide' "$GITHUB_WORKSPACE/out/lean.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-lean
          path: out/
