name: E64 Wave 5 Agent 2 EGRob 3-Connected Closure (Lean 4.36.0)

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  apply_fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Silence 3 unused variable warnings in minimal_bad2_no_defect_free_two_cut
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          p = Path("jobs/erdos64-wave5-agent2-egrob/Wave5Agent2EGRob.lean")
          s = p.read_text()
          old = (
              "theorem minimal_bad2_no_defect_free_two_cut {n : ℕ} {G : SimpleGraph (Fin n)} [DecidableRel G.Adj]\n"
              "    (hmb : MinimalBad2 n G) {a b : Fin n} (hab : a ≠ b)\n"
              "    (hda : G.degree a = 2) (hdb : G.degree b = 2)"
          )
          new = (
              "theorem minimal_bad2_no_defect_free_two_cut {n : ℕ} {G : SimpleGraph (Fin n)} [DecidableRel G.Adj]\n"
              "    (hmb : MinimalBad2 n G) {a b : Fin n} (_hab : a ≠ b)\n"
              "    (_hda : G.degree a = 2) (_hdb : G.degree b = 2)"
          )
          assert old in s, "Target header not found"
          p.write_text(s.replace(old, new, 1))
          print("Fixed unused variable warnings.")
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs/erdos64-wave5-agent2-egrob/Wave5Agent2EGRob.lean
          git commit -m "Silence 3 unused variable warnings in minimal_bad2_no_defect_free_two_cut"
          git push origin main

  verify:
    needs: apply_fix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify Wave5Agent2EGRob and transitive axioms
        run: bash jobs/erdos64-wave5-agent2-egrob/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave5-agent2-egrob
          path: out/
          retention-days: 90
