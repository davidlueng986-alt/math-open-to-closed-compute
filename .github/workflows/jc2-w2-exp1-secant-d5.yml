name: JC2 W2 Exp1 SECANT-HEIGHT-FOUR d=5,6 Pure-Singular Proof
on:
  push:
    branches: ['jc2-w2-exp1-secant-d5']
    paths:
      - 'jobs/jc2_w2_exp1_secant_d5.sing'
      - '.github/workflows/jc2-w2-exp1-secant-d5.yml'
  workflow_dispatch:

jobs:
  singular-secant-d5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular
          Singular --version
      - name: Run pure-Singular exact Q(sqrt(3d)) proof for d=5,6
        run: Singular -q jobs/jc2_w2_exp1_secant_d5.sing
