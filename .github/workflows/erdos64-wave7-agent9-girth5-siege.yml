name: E64 Wave 7 Agent 9 Girth-5 Hunter & Signed-Adjuster OpenMP Siege

on:
  workflow_dispatch:

jobs:
  siege:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run OpenMP C++20 Girth-5 Hunter & Theorem Audit
        run: |
          mkdir -p out
          g++ -O3 -std=c++20 -fopenmp jobs/erdos64-wave7-agent9-girth5-siege/girth5_siege.cpp -o girth5_siege
          ./girth5_siege | tee out/girth5_siege.log
      - uses: actions/upload-artifact@v4
        with:
          name: erdos64-wave7-agent9-girth5-siege
          path: out/
          retention-days: 90
