name: JC2 Exp2 DEGREE-135-IV-GCD-SIX Fast modStd Q-Proof
on:
  push:
    branches: ['jc2-w1-exp2-gcd6-fast']
    paths:
      - 'jobs/jc2_exp2_gcd6_fast.py'
      - '.github/workflows/jc2-w1-exp2-gcd6-fast.yml'
  workflow_dispatch:

jobs:
  singular-gcd6-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular and SymPy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular python3-sympy
          Singular --version
      - name: Run fast exact Q modStd exclusion for DEGREE-135-IV-GCD-SIX
        run: python3 jobs/jc2_exp2_gcd6_fast.py
