name: E64 Wave 4 Agent 4 Global Closure
on:
  push:
    branches: [main]
    paths:
      - 'jobs/erdos64-wave4-agent4-global-closure/**'
      - '.github/workflows/erdos64-wave4-agent4-global-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  lean-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify UniversalGlobalClosure and transitive axioms
        run: bash jobs/erdos64-wave4-agent4-global-closure/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave4-agent4-lean
          path: out/
          retention-days: 90

  nonabelian-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run OpenMP non-abelian cover probe
        run: |
          g++ -O3 -fopenmp -std=c++17 jobs/erdos64-wave4-agent4-global-closure/nonabelian_frontier.cpp -o probe
          ./probe | tee nonabelian_probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave4-agent4-probe
          path: nonabelian_probe.log
          retention-days: 90
