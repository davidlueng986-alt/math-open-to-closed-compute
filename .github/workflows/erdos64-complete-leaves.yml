name: E64 complete terminal exclusions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jobs/erdos64-complete-leaves/**'
      - '.github/workflows/erdos64-complete-leaves.yml'
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact terminal theorems and audit transitive axioms
        run: bash jobs/erdos64-complete-leaves/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-complete-leaves
          path: out/
          retention-days: 90
