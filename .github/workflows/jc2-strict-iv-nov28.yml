name: JC2 strict IV quartic obstruction November 28
on:
  push:
    branches: [main]
    paths:
      - 'jobs/jc2-strict-iv-nov28/**'
      - '.github/workflows/jc2-strict-iv-nov28.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  eliminate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-sage:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Exact characteristic-zero necessary ideal and certificate replay
        run: |
          set -euo pipefail
          mkdir -p out/source
          cp jobs/jc2-strict-iv-nov28/* out/source/
          printf '%s\n' "$GITHUB_SHA" > out/source-commit.txt
          sage --version | tee out/sage-version.txt
          sage -c 'from sage.interfaces.singular import singular; print(singular.version())' | tee out/singular-version.txt
          sha256sum jobs/jc2-strict-iv-nov28/* > out/source-sha256.txt
          sage jobs/jc2-strict-iv-nov28/strict135_IV_quartic_eliminate.sage out/elimination 2>&1 | tee out/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jc2-strict-iv-exact-nov28
          path: out/
          retention-days: 90
