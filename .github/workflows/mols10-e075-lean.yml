name: MOLS10 E075 global incidence-rank audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jobs/mols10-global-proof/Global.lean'
      - '.github/workflows/mols10-e075-lean.yml'
permissions:
  contents: read
  packages: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Kernel check global rank lemmas
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd /opt/mathlib4
          lake env lean -DwarningAsError=true "$GITHUB_WORKSPACE/jobs/mols10-global-proof/Global.lean" 2>&1 | tee "$GITHUB_WORKSPACE/out/lean.log"
          if grep -q 'sorryAx' "$GITHUB_WORKSPACE/out/lean.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mols10-e075-global-lean-audit
          path: |
            out/
            jobs/mols10-global-proof/Global.lean
          retention-days: 30
