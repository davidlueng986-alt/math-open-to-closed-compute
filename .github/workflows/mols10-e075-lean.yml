name: MOLS10 global rank and pruning Lean audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jobs/mols10-global-proof/Global.lean'
      - 'jobs/mols10-global-proof/Pruning.lean'
      - '.github/workflows/mols10-e075-lean.yml'
permissions:
  contents: read
  packages: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Kernel check global rank lemmas
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd /opt/mathlib4
          lake env lean --version
          result=0
          for source in Global Pruning; do
            if ! lake env lean -DwarningAsError=true "$GITHUB_WORKSPACE/jobs/mols10-global-proof/$source.lean" 2>&1 | tee "$GITHUB_WORKSPACE/out/$source.log"; then
              result=1
            fi
          done
          if grep -q 'sorryAx' "$GITHUB_WORKSPACE/out/"*.log; then result=1; fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mols10-e076-global-pruning-lean-audit
          path: |
            out/
            jobs/mols10-global-proof/Global.lean
            jobs/mols10-global-proof/Pruning.lean
          retention-days: 30
