name: E64 Wave 6 Agent 1 EGRob3ConnCore Closure (Lean 4.36.0)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Wave6Agent1EGRob3ConnCore and transitive axioms
        run: bash jobs/erdos64-wave6-agent1-egrob-closure/verify.sh
      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave6-agent1-egrob-closure
          path: out/
          retention-days: 90
