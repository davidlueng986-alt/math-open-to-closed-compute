name: JC2 W2 Exp1 DEGREE-135-IV-GCD-FOUR Pure-Singular Proof
on:
  push:
    branches: ['jc2-w2-exp1-gcd4']
    paths:
      - 'jobs/jc2_w2_exp1_gcd4.sing'
      - '.github/workflows/jc2-w2-exp1-gcd4.yml'
  workflow_dispatch:

jobs:
  singular-gcd4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular
          Singular --version
      - name: Run pure-Singular probe and exact Q-proof for DEGREE-135-IV-GCD-FOUR
        run: Singular -q jobs/jc2_w2_exp1_gcd4.sing
