name: JC2 strict III same-fibre elimination November 28
on:
  push:
    branches: [main]
    paths:
      - 'jobs/jc2-strict-iii-phase-nov28/**'
      - '.github/workflows/jc2-strict-iii-phase-nov28.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  eliminate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write
    timeout-minutes: 30
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-sage:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Cancel the superseded expansion-heavy attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request, urllib.error
          base='https://api.github.com/repos/davidlueng986-alt/math-open-to-closed-compute/actions/runs/46053141184'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers)) as response:
              run=json.load(response)
          if run['head_sha']=='b25ecbba15bea84048ecec48e2c1b0142ab188e5' and run['status']!='completed':
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+'/cancel',data=b'',headers=headers,method='POST')) as response:
                      print('Superseded own attempt cancellation HTTP',response.status)
              except urllib.error.HTTPError as error:
                  if error.code != 409: raise
                  print('Superseded attempt already completed')
          else:
              print('No matching active superseded attempt to cancel')
          PYTHON
      - name: Exact characteristic-zero necessary ideal and certificate replay
        run: |
          set -euo pipefail
          mkdir -p out/source
          cp jobs/jc2-strict-iii-phase-nov28/* out/source/
          printf '%s\n' "$GITHUB_SHA" > out/source-commit.txt
          sage --version | tee out/sage-version.txt
          sage -c 'from sage.interfaces.singular import singular; print(singular.version())' | tee out/singular-version.txt
          sha256sum jobs/jc2-strict-iii-phase-nov28/* > out/source-sha256.txt
          sage jobs/jc2-strict-iii-phase-nov28/strict135_III_phase_eliminate.sage out/elimination 2>&1 | tee out/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jc2-strict-iii-phase-exact-nov28
          path: out/
          retention-days: 90
