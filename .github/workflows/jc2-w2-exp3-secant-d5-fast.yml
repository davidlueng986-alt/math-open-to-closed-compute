name: JC2 W2 Exp3 SECANT-HEIGHT-FOUR d=5 Fast 5-Var Exact Q Proof
on:
  push:
    branches: ['jc2-w2-exp3-secant-d5-fast']
    paths:
      - 'jobs/jc2_w2_exp3_secant_d5_fast.sing'
      - '.github/workflows/jc2-w2-exp3-secant-d5-fast.yml'
  workflow_dispatch:

jobs:
  singular-secant-d5-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq singular
          Singular --version
      - name: Run fast 5-var exact Q proof for d=5 (j=4)
        run: Singular -q jobs/jc2_w2_exp3_secant_d5_fast.sing
