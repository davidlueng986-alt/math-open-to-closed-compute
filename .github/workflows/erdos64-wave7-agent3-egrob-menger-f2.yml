name: E64 Wave 7 Agent 3 EGRob3ConnCore Menger/Tutte/F2 Closure (Lean 4.36.0 + OpenMP)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lean_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/davidlueng986-alt/math-compute-lean:sha-a8ed7fee0a7647cdc0cd1873e18a4499c336107a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Wave 7 Agent 3 Lean 4.36.0 modules and transitive axioms
        run: bash jobs/erdos64-wave7-agent3-egrob-menger-f2/verify.sh
      - name: Upload Lean verification artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave7-agent3-lean
          path: out/
          retention-days: 90

  menger_f2_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compile and run OpenMP C++20 3-connected Menger/Tutte/F2 audit
        run: |
          mkdir -p out
          g++ -O3 -fopenmp -std=c++20 -Wall -Wextra jobs/erdos64-wave7-agent3-egrob-menger-f2/menger_f2_audit.cpp -o menger_f2_audit
          ./menger_f2_audit --full out/menger_f2_audit.json | tee out/menger_f2_audit.log
      - name: Upload C++20 audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos64-wave7-agent3-menger-f2-audit
          path: out/
          retention-days: 90
